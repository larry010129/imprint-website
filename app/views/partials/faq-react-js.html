<script type="module">
  const root = document.querySelector("[data-faq-root]");
  let requested = false;
  const ensureStylesheet = () => {
    if (document.querySelector('link[href^="/static/react/faq.css"]')) return;
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "/static/react/faq.css?v=5";
    document.head.append(link);
  };
  const load = () => {
    if (requested) return;
    requested = true;
    ensureStylesheet();
    void import("/static/react/faq.js?v=10");
  };
  if (root) {
    const nearViewport = root.getBoundingClientRect().top <= window.innerHeight + 800;
    if (nearViewport || !("IntersectionObserver" in window)) {
      load();
    } else {
      const observer = new IntersectionObserver((entries) => {
        if (!entries.some((entry) => entry.isIntersecting)) return;
        observer.disconnect();
        load();
      }, { rootMargin: "800px 0px" });
      observer.observe(root);
    }
  }
</script>
