name: Update gold quote

on:
  schedule:
    # Every hour UTC (GitHub may delay schedules by a few minutes)
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Fetch latest Allbeauty gold quote
        run: python scripts/fetch_gold_quote.py

      - name: Commit updated quote files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-quote.json public/js/gold-quote-data.js
          git diff --staged --quiet || git commit -m "chore: update Allbeauty gold quote fallback"
          git push

      # Proactively refresh Render Postgres gold_price_cache (no redeploy).
      # Repo secret IMPRINT_SITE_URL = https://<your-service>.onrender.com
      - name: Refresh Render gold_price_cache
        env:
          SITE_URL: ${{ secrets.IMPRINT_SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "IMPRINT_SITE_URL secret not set; skip live /api/gold-refresh"
            exit 0
          fi
          url="${SITE_URL%/}/api/gold-refresh"
          echo "POST $url"
          curl -fsS -X POST "$url" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 5 --max-time 90
