name: Update gold quote

on:
  schedule:
    # Every hour UTC (GitHub may delay schedules by a few minutes)
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: update-gold-quote
  cancel-in-progress: false

# Checkout only. Do not commit quote files — a push to main redeploys Render.
permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      # Writes quote files in this runner workspace only. Do not commit them.
      # Failed fetch must fail the job so checkout bootstrap JSON is never POSTed.
      - name: Fetch latest Allbeauty gold quote
        run: python scripts/fetch_gold_quote.py

      # Proactively refresh Render Postgres gold_price_cache (no redeploy).
      # Repo secret IMPRINT_SITE_URL = https://<this-fastapi-service>.onrender.com
      # Must be the FastAPI service from render.yaml — NOT the Laravel www host,
      # and NOT a different Render app (e.g. chat RAG) that lacks /api/gold-refresh.
      - name: Refresh Render gold_price_cache
        env:
          SITE_URL: ${{ secrets.IMPRINT_SITE_URL }}
          GOLD_REFRESH_SECRET: ${{ secrets.GOLD_REFRESH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "IMPRINT_SITE_URL secret not set; skip live /api/gold-refresh"
            exit 0
          fi
          if [ -z "${GOLD_REFRESH_SECRET:-}" ]; then
            echo "::warning::GOLD_REFRESH_SECRET secret not set; skip live /api/gold-refresh"
            exit 0
          fi
          base="${SITE_URL%/}"
          health_url="${base}/health"
          refresh_url="${base}/api/gold-refresh"

          # This app's /health is {"ok":true,"service":"imprint-api"} — not
          # {"status":"healthy"} (other Render apps use that and lack /api/gold-refresh).
          echo "Wake/check $health_url"
          health_ok=0
          for i in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS -o /tmp/health.body -w '%{http_code}' --max-time 45 "$health_url" || true)"
            body="$(cat /tmp/health.body 2>/dev/null || true)"
            echo "health attempt $i -> HTTP $code"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"service"[[:space:]]*:[[:space:]]*"imprint-api"'; then
              health_ok=1
              break
            fi
            sleep 10
          done
          if [ "$health_ok" != "1" ]; then
            echo "::error::IMPRINT_SITE_URL /health is not this FastAPI (need service=imprint-api)."
            echo "Got HTTP ${code:-?} body: ${body:-<empty>}"
            echo "Set secret to this repo's Render URL from the dashboard (Blueprint service imprint-api)."
            echo "Do not use https://www.imprint-diamond.com (Laravel) or unrelated onrender apps."
            exit 1
          fi

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("data/gold-quote.json")
          if not path.is_file():
              print("::error::data/gold-quote.json missing after fetch step")
              sys.exit(1)
          try:
              body = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              print(f"::error::gold-quote.json is not valid JSON: {exc}")
              sys.exit(1)
          if not isinstance(body, dict):
              print("::error::gold-quote.json must be an object")
              sys.exit(1)
          quote = body.get("quote") or {}
          metals = body.get("metals") or {}
          if not isinstance(quote, dict) or not isinstance(metals, dict):
              print("::error::gold-quote.json quote/metals must be objects")
              sys.exit(1)
          try:
              xau = float(quote.get("sell") or metals.get("XAU") or 0)
              xpt = float(metals.get("XPT") or 0)
              xag = float(metals.get("XAG") or 0)
          except (TypeError, ValueError):
              print("::error::gold-quote.json metals are not numeric")
              sys.exit(1)
          if xau <= 0:
              print("::error::fetched XAU missing or <= 0; skip refresh to keep cache")
              sys.exit(1)
          # Never POST hardcoded empty-cache fallback over a good gold_price_cache row.
          if (xau, xpt, xag) == (4300.0, 1050.0, 61.0):
              print("::error::hardcoded 4300/1050/61 fallback; will not overwrite cache")
              sys.exit(1)
          print(f"quote ok XAU={xau} XPT={xpt} XAG={xag}")
          PY

          echo "POST $refresh_url (scraped quote JSON; cache-only, no git push)"
          code="$(curl -sS -o /tmp/refresh.body -w '%{http_code}' \
            -X POST "$refresh_url" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${GOLD_REFRESH_SECRET}" \
            --data-binary @data/gold-quote.json \
            --retry 3 --retry-delay 5 --max-time 90 || true)"
          body="$(cat /tmp/refresh.body 2>/dev/null || true)"
          echo "refresh -> HTTP $code"
          echo "$body"
          case "$code" in
            200|201) echo "$body" | grep -q '"ok"[[:space:]]*:[[:space:]]*true' || {
              echo "::error::gold-refresh returned $code without ok:true"
              exit 1
            } ;;
            *)
              echo "::error::gold-refresh failed with HTTP $code (curl exit 22 was -f on non-2xx)."
              exit 1
              ;;
          esac
