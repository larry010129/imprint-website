{% extends "layouts/base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/member-app.css?v=18">
<link rel="stylesheet" href="/static/css/shop-cart.css?v=5">
{% endblock %}
{% block content %}
<section class="page-section member-app" id="mvc-cart" aria-label="購物車">
  <div class="container">
    <div class="price-reference member-panel">
      <div class="price-reference-head">
        <p class="eyebrow">SHOP</p>
        <h1 class="price-reference-title">購物車</h1>
        <p class="price-reference-lead">勾選品項後送出訂單，未勾選的品項會保留在購物車。</p>
      </div>
      <div id="htmx-cart"
        hx-get="/htmx/cart"
        hx-trigger="load"
        hx-swap="innerHTML">
        <div class="skel-panel" aria-busy="true">
          <ul class="skel-cart-list"><li class="skel-cart-item"><span class="skel-block skel-block--xs"></span><span class="skel-block skel-block--thumb"></span><div><span class="skel-line skel-line--long"></span></div></li></ul>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
