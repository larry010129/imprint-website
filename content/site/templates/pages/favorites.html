{% extends "layouts/base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/member-app.css?v=8">
{% endblock %}
{% block content %}
<section class="page-section member-app" id="mvc-favorites" aria-label="收藏款式">
  <div class="container">
    <div class="price-reference member-panel">
      <div class="price-reference-head">
        <p class="eyebrow">SAVED</p>
        <h1 class="price-reference-title">收藏款式</h1>
        <p class="price-reference-lead">快速載入常用配置，並以目前金價重新試算。</p>
      </div>
      <div id="htmx-favorites"
        hx-get="/htmx/favorites"
        hx-trigger="load"
        hx-swap="innerHTML">
        <div class="skel-panel" aria-busy="true"><div class="skel-fav-grid"><div class="skel-fav-card"><div class="skel-fav-card__img"></div></div></div></div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
