{% extends "layouts/base.html" %}

{% block extra_body_class %}is-checkout-page{% endblock %}

{% block social_fab %}{% endblock %}
{% block botpress_webchat %}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/member-app.css?v=2">
<link rel="stylesheet" href="/static/css/checkout-page.css?v=12">
{% endblock %}

{% block content %}
<section class="page-section member-app checkout-page" aria-label="確認訂單">
  <div class="container checkout-container">
    <nav class="checkout-stepper" aria-label="結帳步驟">
      <div class="checkout-stepper-step is-done">
        <span class="checkout-stepper-bar" aria-hidden="true"></span>
        <a class="checkout-stepper-label" href="/cart.html">購物車</a>
      </div>
      <div class="checkout-stepper-step is-active">
        <span class="checkout-stepper-bar" aria-hidden="true"></span>
        <span class="checkout-stepper-label">確認訂單</span>
      </div>
      <div class="checkout-stepper-step">
        <span class="checkout-stepper-bar" aria-hidden="true"></span>
        <span class="checkout-stepper-label">完成</span>
      </div>
    </nav>

    <div id="htmx-checkout"
      hx-get="/htmx/checkout"
      hx-trigger="load"
      hx-swap="innerHTML"
      hx-vals='js:{items: new URLSearchParams(location.search).get("items") || new URLSearchParams(location.search).get("item") || ""}'>
      <div class="checkout-skel" aria-busy="true"><p>載入訂單…</p></div>
    </div>
  </div>
</section>
{% endblock %}
