{% extends "layouts/base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/member-app.css?v=1">
{% endblock %}
{% block content %}
<section class="page-section member-app" aria-label="通知">
  <div class="container">
    <div class="price-reference member-panel">
      <div class="price-reference-head">
        <p class="eyebrow">INBOX</p>
        <h1 class="price-reference-title">通知</h1>
      </div>
      <div id="htmx-notifications"
        hx-get="/htmx/notifications"
        hx-trigger="load"
        hx-swap="innerHTML">
        <div class="skel-panel" aria-busy="true"><span class="skel-line skel-line--medium"></span></div>
      </div>
    </div>
  </div>
</section>
{# ponytail: mark-read / delete actions deferred; upgrade = hx-post to /htmx/notifications/* when inbox UX needs it #}
{% endblock %}
