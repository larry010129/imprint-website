{% extends "layouts/base.html" %}



{% block content %}

<div class="price-page">

<div class="container price-page-top">

  <h1 class="section-title price-page__h1" data-cms-text="hero-title">DNA 紀念鑽石價格總覽</h1>

  <section class="price-cta reveal" aria-label="規劃 DNA 鑽石規格">

    <div class="price-cta__card">

      <div class="price-cta__main">

        <h2 class="price-cta__title" data-cms-text="cta-title">還在規劃 DNA 鑽石規格？</h2>

        <p class="price-cta__desc" data-cms-text="cta-desc">先看牌價表掌握克拉區間，再用戒台試算估預算。</p>

        <div class="price-cta__actions">
          <div class="price-cta__btn-wrap">
            <span class="price-cta__glow" aria-hidden="true"></span>
            <a class="price-cta__btn" href="/shop/calculator/">
              <span data-cms-text="cta-calc">戒台試算</span>
              <svg class="price-cta__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </a>
          </div>
          <a class="price-cta__link" href="/gold-price" data-cms-button="cta-gold">黃金牌價</a>
        </div>

      </div>

      <ul class="price-cta__list">

        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-cms-text="cta-li-1">確認克拉數與實際區間</span></li>

        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-cms-text="cta-li-2">白鑽／彩鑽報價對照</span></li>

        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-cms-text="cta-li-3">切工形狀加價規則</span></li>

        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-cms-text="cta-li-4">多顆鑽石組合折扣</span></li>

        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-cms-text="cta-li-5">戒台材質與款式試算</span></li>

      </ul>

    </div>

  </section>

</div>



<div class="price-page-body">

{% include "partials/price-page-body.html" %}

</div>

</div>

{% endblock %}



{% block extra_scripts %}

<script src="/static/js/shape-marquee.js?v=1" defer></script>

{% endblock %}
