{% extends "layouts/base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/member-app.css?v=8">
{% endblock %}
{% block content %}
<section class="page-section member-app" aria-label="訂購紀錄">
  <div class="container">
    <div class="price-reference member-panel">
      <div class="price-reference-head">
        <p class="eyebrow">ORDERS</p>
        <h1 class="price-reference-title">訂購紀錄</h1>
      </div>
      <div id="htmx-history"
        hx-get="/htmx/history"
        hx-trigger="load"
        hx-swap="innerHTML">
        <div class="skel-panel" aria-busy="true"><span class="skel-line skel-line--long"></span></div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
{% block extra_scripts %}
<script src="/static/js/order-detail.js?v=2" defer></script>
{% endblock %}
