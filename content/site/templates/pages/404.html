{% extends "layouts/base.html" %}

{% endblock %}

  <div class="container page-hero-inner">
    <div class="error-404__intro">
      <h1 id="error-404-title">找不到這個頁面</h1>

        <a class="btn btn-mint btn-neon btn-neon--solid error-404__btn" href="/">回首頁</a>

    </div>
  </div>
