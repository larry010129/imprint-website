{% extends "layouts/base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/member-app.css?v=3">
{% endblock %}
{% block content %}
<section class="page-section member-app profile-page-shell" aria-label="帳戶設定">
  <div class="container">
    <div class="price-reference member-panel">
      <div class="price-reference-head">
        <p class="eyebrow">ACCOUNT</p>
        <h1 class="price-reference-title">帳戶設定</h1>
      </div>
      <div id="htmx-profile"
        hx-get="/htmx/profile"
        hx-trigger="load"
        hx-swap="innerHTML">
        <div class="skel-panel" aria-busy="true"><span class="skel-line skel-line--medium"></span></div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
