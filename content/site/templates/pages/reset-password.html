{% extends "layouts/base.html" %}
{% block extra_head %}
<meta name="referrer" content="no-referrer">
{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="/static/css/member-app.css?v=8">
<link rel="stylesheet" href="/static/css/auth.css?v=12">
{% endblock %}
{% block content %}
<section class="auth-section" id="view-reset-password">
  <div class="auth-card">
    <h1>重設密碼</h1>
    <p class="sub">請輸入您的新密碼（至少 8 碼）。</p>
    <div id="auth-form-msg"></div>
    <form id="resetPasswordForm" novalidate
      hx-post="/htmx/auth/reset-password"
      hx-target="#auth-form-msg"
      hx-swap="innerHTML">
      <input type="hidden" name="token" value="{{ request.query_params.get('token', '') }}">
      <div class="form-field">
        <label for="rpPassword">新密碼 <span class="req">*</span></label>
        <input type="password" id="rpPassword" name="password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="form-field">
        <label for="rpPasswordConfirm">確認新密碼 <span class="req">*</span></label>
        <input type="password" id="rpPasswordConfirm" name="passwordConfirm" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="btn btn-dark" id="resetSubmitBtn">重設密碼</button>
    </form>
    <p class="switch-link"><a href="/login">回登入頁</a></p>
  </div>
</section>
{% endblock %}
{% block extra_scripts %}
<script src="/static/js/reset-password.js?v=1"></script>
{% endblock %}
