<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<script>window.imgFallback=function(img){var s=img.dataset.fbStep?parseInt(img.dataset.fbStep,10):0;var e=["jpg","png","jpeg"];var pic=img.parentElement&&img.parentElement.tagName==="PICTURE"?img.parentElement:null;if(s<e.length-1){s++;img.dataset.fbStep=String(s);if(pic){var srcs=pic.querySelectorAll("source");for(var i=0;i<srcs.length;i++){srcs[i].remove();}}img.src=img.src.replace(/\.(jpg|jpeg|png)(\?.*)?$/i,"."+e[s]+"$2");}else{(pic||img).remove();}};</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title }}{% endblock %}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/static/css/base.css?v=4.1">
<link rel="stylesheet" href="/static/css/pages.css?v=5.27">
<link rel="stylesheet" href="/static/css/responsive.css?v=3.15">
{% block extra_css %}{% endblock %}
<style>
  body.cms-embed-layout {
    background: #fff;
    margin: 0;
    min-height: 100%;
  }
  body.cms-embed-layout main {
    min-height: 100vh;
  }
  /* Preview: show this page only — no site chrome */
  body.cms-embed-layout .site-chrome,
  body.cms-embed-layout .social-fab,
  body.cms-embed-layout #bp-web-widget-container {
    display: none !important;
  }
</style>
{% block extra_head %}{% endblock %}
</head>
<body class="cms-embed-layout cms-modular{% if extra_body_class %} {{ extra_body_class }}{% endif %}" data-cms-embed="1"{% if mvc_page %} data-mvc="{{ mvc_page }}"{% endif %}>
<main>
{% block content %}{% endblock %}
</main>
{% block extra_scripts %}{% endblock %}
</body>
</html>
