{% if coupon_error %}
<p class="form-msg is-error" role="alert">{{ coupon_error }}</p>
{% elif coupon %}
<p class="form-msg is-ok" role="status">
  已套用 {{ coupon.code }}{% if coupon.label %}（{{ coupon.label }}）{% endif %}
  — 折扣 {{ format_twd(coupon.discountAmount) }}，應付 {{ format_twd(coupon.total) }}
</p>
<script>
(function(){
  var el=document.getElementById('couponInput');
  if(el) el.value={{ coupon.code|tojson }};
})();
</script>
{% endif %}
