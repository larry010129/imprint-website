{# Mobile drawer cart — rendered only when logged in #}
<li id="site-nav-cart-mobile" class="mobile-animated-nav__item">
  <a href="/cart.html" class="mobile-animated-nav__link nav-cart-mobile-link" aria-label="購物車">
    <svg class="nav-cart-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
      <path d="M6 6h15l-1.5 9h-12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 6L5 3H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="9" cy="20" r="1.25" fill="currentColor"/>
      <circle cx="18" cy="20" r="1.25" fill="currentColor"/>
    </svg>
    <span class="nav-cart-badge{% if count %} is-hot{% endif %}"{% if count %} aria-label="購物車 {{ count }} 件"{% else %} aria-hidden="true"{% endif %}>{% if count %}{{ count }}{% endif %}</span>
  </a>
</li>
