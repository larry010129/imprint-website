{% if guest %}
<div class="member-state member-state--empty">
  <p>請先登入以查看收藏。</p>
  <a href="/login.html?next=/favorites.html" class="btn btn-mint">會員登入</a>
</div>
{% elif not items %}
<div class="member-state member-state--empty"><p>尚無收藏款式。</p>
  <a href="/shop/calculator/" class="btn btn-mint">前往品項訂製</a></div>
{% else %}
<div class="member-favorites-grid">
  {% for item in items %}
  <article class="member-fav-card">
    <div class="member-fav-card__body">
      <p>{{ item.summary_zh or item.style_type or '收藏款式' }}</p>
      <p class="text-faint">{{ item.category }}</p>
      <a class="btn btn-line" href="/shop/calculator/?fav={{ item.id }}">載入試算</a>
    </div>
  </article>
  {% endfor %}
</div>
{% endif %}
