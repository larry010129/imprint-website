<script>
  (() => {
    "use strict";

    let loadPromise;
    let scheduledIdle;

    const appendScript = (src) => new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = src;
      script.async = true;
      script.onload = resolve;
      script.onerror = () => reject(new Error(`Unable to load ${src}`));
      document.head.append(script);
    });

    window.loadImprintChat = () => {
      if (loadPromise) return loadPromise;
      if (window.botpress) return Promise.resolve(window.botpress);
      loadPromise = appendScript("https://cdn.botpress.cloud/webchat/v3.6/inject.js")
        .then(() => appendScript("https://files.bpcontent.cloud/2026/03/15/22/20260315220508-1BHDZ8TO.js"))
        .then(() => appendScript("/static/js/botpress-theme.js?v=4"))
        .then(() => window.botpress)
        .catch((error) => {
          loadPromise = undefined;
          throw error;
        });
      return loadPromise;
    };

    const prepareChat = () => {
      void window.loadImprintChat().catch(() => {});
    };

    const scheduleIdlePrefetch = () => {
      if (scheduledIdle) return;
      scheduledIdle = true;
      if ("requestIdleCallback" in window) {
        requestIdleCallback(prepareChat, { timeout: 12000 });
      } else {
        setTimeout(prepareChat, 8000);
      }
    };

    document.addEventListener(
      "click",
      (event) => {
        if (event.target.closest("[data-social-fab-chat]")) prepareChat();
      },
      true
    );

    document.addEventListener(
      "keydown",
      (event) => {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (event.target.closest("[data-social-fab-chat]")) prepareChat();
      },
      true
    );

    if (document.readyState === "complete") scheduleIdlePrefetch();
    else window.addEventListener("load", scheduleIdlePrefetch, { once: true });
  })();
</script>
