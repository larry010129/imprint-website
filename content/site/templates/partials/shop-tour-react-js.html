<script>
  (() => {
    let loaded = false;
    const TOUR_START = "imprint-shop-tour-start";
    const loadTour = () => {
      if (loaded) {
        window.dispatchEvent(new Event(TOUR_START));
        return;
      }
      loaded = true;
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "/static/react/shop-tour.css?v=18";
      document.head.appendChild(css);
      import("/static/react/shop-tour.js?v=18")
        .then(() => window.dispatchEvent(new Event(TOUR_START)))
        .catch(() => { loaded = false; });
    };
    const bind = (el) => {
      if (!el || el.dataset.tourBound) return;
      el.dataset.tourBound = "1";
      el.addEventListener("click", (event) => {
        event.preventDefault();
        loadTour();
      });
    };
    document.querySelectorAll("[data-shop-tour-start]").forEach(bind);
  })();
</script>
