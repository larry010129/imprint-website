<script>
(function () {
  function injectFab() {
    if (window.__socialFabInjected) return;
    window.__socialFabInjected = true;
    ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
      window.removeEventListener(evt, injectFab, true);
    });
    var s = document.createElement('script');
    s.src = '/static/js/social-fab.js?v=11';
    s.defer = true;
    document.body.appendChild(s);
  }
  var isHome = document.body && document.body.classList.contains('page-home');
  if (!isHome) {
    injectFab();
    return;
  }
  /* Home: load FAB JS after first interaction / 12s. */
  var FAB_FALLBACK_MS = 12000;
  ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
    window.addEventListener(evt, injectFab, { once: true, passive: true, capture: true });
  });
  function schedule() { setTimeout(injectFab, FAB_FALLBACK_MS); }
  if (document.readyState === 'complete') schedule();
  else window.addEventListener('load', schedule);
})();
</script>
