<section class="cms-section cms-cta{% if props.image_url %} cms-cta--has-media{% endif %}" data-cms-reveal data-cms-section-id="{{ section.id }}" data-cms-section-type="cta_band">
  {% if props.image_url %}
  <div class="cms-cta__media">
    <img src="{{ props.image_url }}" srcset="{{ props.image_url }} 1600w" sizes="100vw" width="1600" height="600" alt="{{ props.image_alt or '' }}" loading="lazy" fetchpriority="low" decoding="async" data-cms-editable="image_url" data-cms-prop="image_url">
  </div>
  {% elif cms_inline or site_cms_edit %}
  <div class="cms-cta__media cms-cta__media--empty">
    <button type="button" class="cms-image-upload-placeholder" data-cms-editable="image_url" data-cms-prop="image_url">
      <span>選用 CTA 圖片（選填）</span>
      <small>點擊上傳</small>
    </button>
  </div>
  {% endif %}
  <div class="container cms-cta__copy">
    <h2 data-cms-editable="text" data-cms-prop="title">{{ props.title }}</h2>
    {% if props.lead %}
    <p class="cms-lead" data-cms-editable="text" data-cms-prop="lead">{{ props.lead }}</p>
    {% endif %}
    <div class="cms-actions">
      {% if props.cta_label %}
      <a class="cms-btn cms-btn--solid" href="{{ props.cta_href or '#' }}" data-cms-editable="button" data-cms-prop="cta_label" data-cms-href-prop="cta_href">{{ props.cta_label }}</a>
      {% endif %}
      {% if props.cta_secondary_label %}
      <a class="cms-btn cms-btn--ghost" href="{{ props.cta_secondary_href or '#' }}" data-cms-editable="button" data-cms-prop="cta_secondary_label" data-cms-href-prop="cta_secondary_href">{{ props.cta_secondary_label }}</a>
      {% endif %}
    </div>
  </div>
</section>
