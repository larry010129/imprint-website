<section class="cms-section cms-rich cms-rich--cols-{{ props.columns or 1 }}" data-cms-reveal data-cms-section-id="{{ section.id }}" data-cms-section-type="rich_text">
  <div class="container">
    {% if props.title %}
    <h2 data-cms-editable="text" data-cms-prop="title">{{ props.title }}</h2>
    {% endif %}
    {% if props.body %}
    <div class="cms-body" data-cms-editable="text" data-cms-prop="body">{{ props.body }}</div>
    {% endif %}
  </div>
</section>
