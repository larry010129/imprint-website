
<div class="login-container light" data-auth-container="" id="authContainer">
<canvas aria-hidden="true" class="particles-canvas" data-auth-particles=""></canvas>
<a class="back-home" href="/">
<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
    返回首頁
  </a>
<button aria-label="切換深色模式" class="theme-toggle" data-auth-theme-toggle="" type="button">
<svg aria-hidden="true" data-auth-theme-icon-moon="" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
<svg aria-hidden="true" data-auth-theme-icon-sun="" fill="none" hidden="" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
</button>
<div class="login-card">
<div class="login-card-inner">
<div class="login-header">
<h1>加入會員</h1>
<p>註冊會員即可查詢您的訂製進度、保留聯絡資料，讓顧問更快為您服務。</p>
</div>
<div id="auth-form-msg"></div>
<form class="login-form" hx-disabled-elt="button[type=submit]" hx-post="/htmx/auth/register" hx-swap="innerHTML" hx-target="#auth-form-msg" id="registerForm" novalidate="">
<div class="form-field">
<input autocomplete="name" id="rName" name="fullName" placeholder=" " required="" type="text"/>
<label for="rName">姓名</label>
</div>
<div class="form-field">
<input autocomplete="tel" id="rPhone" inputmode="numeric" name="phone" pattern="[0-9]*" placeholder=" " required="" type="tel"/>
<label for="rPhone">電話</label>
</div>
<div class="form-field">
<input autocomplete="username" id="rEmail" name="email" pattern="[^\s@]+@[^\s@]+\.[A-Za-z]{2,}" placeholder=" " required="" title="請輸入有效的 Email 格式" type="email"/>
<label for="rEmail">電子郵件</label>
</div>
<div class="form-field">
<input autocomplete="new-password" id="rPassword" minlength="8" name="password" placeholder=" " required="" type="password"/>
<label for="rPassword">密碼（至少 8 碼）</label>
<button aria-label="顯示密碼" class="toggle-password" data-auth-toggle-password="" type="button">
<svg aria-hidden="true" data-auth-eye-icon="" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg aria-hidden="true" data-auth-eye-off-icon="" fill="none" hidden="" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
</button>
</div>
<div class="form-field">
<input autocomplete="new-password" id="rPasswordConfirm" minlength="8" name="passwordConfirm" placeholder=" " required="" type="password"/>
<label for="rPasswordConfirm">確認密碼</label>
<button aria-label="顯示密碼" class="toggle-password" data-auth-toggle-password="" type="button">
<svg aria-hidden="true" data-auth-eye-icon="" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg aria-hidden="true" data-auth-eye-off-icon="" fill="none" hidden="" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
</button>
</div>
<label class="partner-check">
<input data-auth-partner-toggle="" id="rIsPartner" name="isPartner" type="checkbox" value="1"/>
<span class="checkmark"></span>
      我是合作廠商
    </label>
<div class="form-field" data-auth-invite-code-field="" hidden="" id="inviteCodeField">
<input id="rInviteCode" name="inviteCode" placeholder=" " type="text"/>
<label for="rInviteCode">合作廠商邀請碼</label>
</div>
<div class="form-field">
<input autocomplete="off" id="rReferralCode" name="referralCode" placeholder=" " type="text"/>
<label for="rReferralCode">好友邀請碼（選填）</label>
</div>
<div class="form-field recaptcha-field" data-auth-recaptcha="">
<div class="g-recaptcha" data-sitekey=""></div>
</div>
<label class="partner-check terms-check" id="registerTermsTrigger">
<input id="rAcceptTerms" name="acceptTerms" required="" type="checkbox" value="1"/>
<span aria-hidden="true" class="checkmark"></span>
<span class="terms-check-label">
        我已閱讀並同意
        <a data-register-terms-open="" href="/terms.html">服務條款</a>
        與
        <a data-register-terms-open="" href="/privacy.html">隱私權政策</a>
</span>
</label>
<p class="terms-check-hint">需開啟條款並捲動至底部後才能勾選同意</p>
<button class="login-button" id="registerSubmitBtn" type="submit">建立會員帳號</button>
</form>
<p class="signup-prompt">已經是會員了？<a href="/login.html">直接登入</a></p>
</div>
</div>
</div>
<dialog aria-labelledby="register-terms-title" class="register-terms-dialog" id="register-terms-dialog">
<header class="register-terms-header">
<h2 id="register-terms-title">會員服務條款與隱私權政策</h2>
</header>
<div class="register-terms-scroll">
<article class="register-terms-sections">
<section class="register-terms-section">
<p>請詳閱網站<a href="/terms.html" rel="noopener" target="_blank">服務條款</a>與<a href="/privacy.html" rel="noopener" target="_blank">隱私權政策</a>全文後再同意。</p>
</section>
</article>
</div>
<footer class="register-terms-footer">
<div class="register-terms-actions">
<button class="register-terms-btn register-terms-btn--outline" id="register-terms-decline" type="button">稍後再說</button>
<button class="register-terms-btn register-terms-btn--primary" id="register-terms-agree" type="button">我同意</button>
</div>
</footer>
</dialog>
