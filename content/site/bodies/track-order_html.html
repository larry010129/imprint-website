<section class="auth-section" id="view-track-order">
<div class="auth-card auth-card--narrow">
<h1>查詢訂製進度</h1>
<p class="sub">輸入顧問提供的訂單編號與您的聯絡電話，即可查詢目前進度，不需要註冊會員。</p>
<form id="trackForm" novalidate="">
<div class="form-field">
<label for="tOrderNumber">訂單編號 <span class="req">*</span></label>
<input id="tOrderNumber" name="orderNumber" placeholder="例如 IMP-20260714-0001" required="" type="text"/>
</div>
<div class="form-field">
<label for="tPhone">聯絡電話 <span class="req">*</span></label>
<input autocomplete="tel" id="tPhone" name="phone" required="" type="tel"/>
</div>
<button class="btn btn-dark" id="trackSubmitBtn" type="submit">查詢進度</button>
<p aria-live="polite" class="form-msg" id="trackFormMsg" role="status"></p>
</form>
<div class="order-result" id="orderResult"></div>
<p class="switch-link">已經是會員？<a href="/login.html">登入查看全部訂單</a></p>
</div>
</section>
