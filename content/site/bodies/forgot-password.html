
<div class="login-container light" data-auth-container="" id="authContainer">
<canvas aria-hidden="true" class="particles-canvas" data-auth-particles=""></canvas>
<a class="back-home" href="/">
<svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
    返回首頁
  </a>
<button aria-label="切換深色模式" class="theme-toggle" data-auth-theme-toggle="" type="button">
<svg aria-hidden="true" data-auth-theme-icon-moon="" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
<svg aria-hidden="true" data-auth-theme-icon-sun="" fill="none" hidden="" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
</button>
<div class="login-card">
<div class="login-card-inner">
<div class="fp-step" data-fp-home-header="">
<div class="login-header">
<h1>忘記密碼</h1>
<p>可用信件重設，也可以使用驗證碼。</p>
</div>
</div>
<div id="auth-form-msg"></div>
<div class="fp-wizard" data-fp-wizard="" id="forgot-password-wizard">
<div class="fp-step" data-fp-step="1">
<form class="login-form" hx-disabled-elt="button[type=submit]" hx-post="/htmx/auth/request-reset" hx-swap="innerHTML" hx-target="#auth-form-msg" id="fp-email-form">
<div class="form-field">
<input autocomplete="username" id="fpEmail" name="email" placeholder=" " required="" type="email"/>
<label for="fpEmail">電子郵件</label>
</div>
<button class="login-button" type="submit">寄出重設信件</button>
</form>
<p class="auth-divider">或</p>
<button class="login-button login-button--outline" data-fp-use-totp="" type="button">使用驗證碼</button>
<p class="fp-hint">Authenticator 的 6 位數或備用碼</p>
</div>
<div class="fp-step" data-fp-step="inbox" hidden="">
<div class="login-header">
<h1>請查看信箱</h1>
<p>若此 Email 已註冊，重設連結已寄出。請開啟主旨為「重設銘印鑽石帳戶密碼」的信件，於一小時內設定新密碼。沒看到的話，請查看垃圾郵件匣。</p>
</div>
<p class="signup-prompt">
<button class="btn-link" data-fp-back="1" type="button">重新輸入 Email</button>
</p>
<p class="signup-prompt">
<a data-fp-use-totp="" href="#">已啟用 Authenticator？使用驗證碼</a>
</p>
</div>
<div class="fp-step" data-fp-step="2" hidden="">
<form class="login-form" hx-disabled-elt="button[type=submit]" hx-post="/htmx/auth/forgot-password-verify" hx-swap="innerHTML" hx-target="#auth-form-msg" id="fp-verify-form" novalidate="">
<input id="fpEmailHidden" name="email" type="hidden" value=""/>
<input id="fpCodeHidden" name="code" type="hidden" value=""/>
<input id="fpBackupHidden" name="backup" type="hidden" value=""/>
<div class="otp-field" data-otp-field="">
<p class="fp-lead">請輸入 Authenticator 的 6 位數驗證碼，或改用備用碼。</p>
<p class="otp-label">6 位數驗證碼</p>
<div aria-label="6 位數驗證碼" class="otp-input-group" data-otp-group="" data-otp-target="fpCodeHidden" role="group">
<input aria-label="第 1 碼" autocomplete="one-time-code" class="otp-digit" data-otp-digit="" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text"/>
<input aria-label="第 2 碼" class="otp-digit" data-otp-digit="" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text"/>
<input aria-label="第 3 碼" class="otp-digit" data-otp-digit="" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text"/>
<input aria-label="第 4 碼" class="otp-digit" data-otp-digit="" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text"/>
<input aria-label="第 5 碼" class="otp-digit" data-otp-digit="" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text"/>
<input aria-label="第 6 碼" class="otp-digit" data-otp-digit="" inputmode="numeric" maxlength="1" pattern="[0-9]" type="text"/>
</div>
<div class="form-field fp-backup-field" data-fp-backup-field="" hidden="">
<input autocomplete="off" id="fpBackupCode" inputmode="text" maxlength="16" placeholder=" " type="text"/>
<label for="fpBackupCode">備用碼</label>
</div>
</div>
<button class="login-button" type="submit">驗證</button>
<button class="login-button login-button--outline" data-fp-back="1" type="button">返回</button>
</form>
<p class="signup-prompt">
<a data-fp-toggle-backup="" href="#">使用備用碼</a>
</p>
</div>
<div class="fp-step" data-fp-step="3" hidden="">
<form class="login-form" hx-disabled-elt="button[type=submit]" hx-post="/htmx/auth/forgot-password" hx-swap="innerHTML" hx-target="#auth-form-msg" id="fp-password-form" novalidate="">
<div class="form-field">
<input autocomplete="new-password" id="fpPassword" minlength="8" name="password" placeholder=" " required="" type="password"/>
<label for="fpPassword">新密碼</label>
<button aria-label="顯示密碼" class="toggle-password" data-auth-toggle-password="" type="button">
<svg aria-hidden="true" data-auth-eye-icon="" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg aria-hidden="true" data-auth-eye-off-icon="" fill="none" hidden="" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
</button>
</div>
<div class="form-field">
<input autocomplete="new-password" id="fpPasswordConfirm" minlength="8" name="passwordConfirm" placeholder=" " required="" type="password"/>
<label for="fpPasswordConfirm">確認新密碼</label>
<button aria-label="顯示密碼" class="toggle-password" data-auth-toggle-password="" type="button">
<svg aria-hidden="true" data-auth-eye-icon="" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg aria-hidden="true" data-auth-eye-off-icon="" fill="none" hidden="" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path><path d="m2 2 20 20"></path></svg>
</button>
</div>
<div class="fp-step-actions">
<button class="btn-link" data-fp-back="2" type="button">返回</button>
<button class="login-button" type="submit">重設密碼</button>
</div>
</form>
</div>
</div>
<p class="signup-prompt"><a href="/login">返回登入</a></p>
</div>
</div>
</div>
