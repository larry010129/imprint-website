<section class="auth-section" id="view-reset-password">
<div class="auth-card">
<h1>重設密碼</h1>
<p class="sub">請輸入您的新密碼。</p>
<form id="resetPasswordForm" novalidate="">
<div class="form-field">
<label for="rpPassword">新密碼 <span class="req">*</span></label>
<input autocomplete="new-password" id="rpPassword" minlength="6" name="password" required="" type="password"/>
</div>
<button class="btn btn-dark" id="resetSubmitBtn" type="submit">重設密碼</button>
<p aria-live="polite" class="form-msg" id="resetFormMsg" role="status"></p>
</form>
<p class="switch-link"><a href="/login.html">回登入頁</a></p>
</div>
</section>
