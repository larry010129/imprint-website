
<section class="auth-section" id="view-reset-password">
<div class="auth-card">
<h1>重設密碼</h1>
<p class="sub">請輸入您的新密碼（至少 8 碼）。</p>
<div id="auth-form-msg"></div>
<form hx-post="/htmx/auth/reset-password" hx-swap="innerHTML" hx-target="#auth-form-msg" id="resetPasswordForm" novalidate="">
<input name="token" type="hidden" value=""/>
<div class="form-field">
<label for="rpPassword">新密碼 <span class="req">*</span></label>
<input autocomplete="new-password" id="rpPassword" minlength="8" name="password" required="" type="password"/>
</div>
<button class="btn btn-dark" id="resetSubmitBtn" type="submit">重設密碼</button>
</form>
<p class="switch-link"><a href="/login.html">回登入頁</a></p>
</div>
</section>
