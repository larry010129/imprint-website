<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>銘印鑽石｜更新說明</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/admin1-shell.css?v=8">
<link rel="stylesheet" href="/static/react/admin-tables.css?v=43">
<style>
  body.admin1-body .rn-editor-main {
    max-width: none;
    margin: 0;
    padding: 1.25rem 1.5rem 2.5rem;
    width: 100%;
  }
  body.admin1-body .rn-editor-main [data-admin-root] {
    max-width: none;
  }
  body.admin1-body .admin-nav-visibility-panel {
    display: grid;
    gap: 1.25rem;
  }
  body.admin1-body .admin-nav-visibility-panel h2 {
    margin: 0;
    font-size: 1.25rem;
  }
  body.admin1-body .admin-nav-visibility-panel p {
    margin: .35rem 0 0;
    color: var(--a1-muted, #8a817b);
    font-size: .875rem;
  }
  body.admin1-body .admin-nav-visibility-list {
    display: grid;
    gap: .5rem;
  }
  body.admin1-body .admin-nav-visibility-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: .75rem;
    padding: .8rem 1rem;
    border: 1px solid var(--a1-border, #ede7e0);
    border-radius: .6rem;
    background: var(--a1-surface, #fff);
    cursor: pointer;
  }
  body.admin1-body .admin-nav-visibility-row span { display: grid; gap: .15rem; }
  body.admin1-body .admin-nav-visibility-row small { color: var(--a1-muted, #8a817b); font-size: .7rem; }
  body.admin1-body .admin-nav-visibility-row em { min-width: 2.5rem; color: var(--a1-muted, #8a817b); font-size: .75rem; font-style: normal; }
  body.admin1-body .admin-nav-visibility-actions { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  body.admin1-body .admin-nav-visibility-actions [role="status"] { color: var(--a1-muted, #8a817b); font-size: .8rem; }
</style>
</head>
<body class="admin1-body">

    <div class="side-head">
      <div class="side-brand-block">
        <span class="side-brand-mark" aria-hidden="true">印</span>
        <span class="side-head-title">銘印鑽石</span>
      </div>
    </div>
    <nav class="side-nav">
      <div class="side-nav-section">
        <p class="side-nav-label">導覽</p>
        <div class="side-nav-items">
          <a class="side-nav-link" href="/admin">
            <svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>

          </button>
          <button type="button" data-rn-tab="release-history">

            <span>版本更新紀錄</span>

          <button type="button" data-rn-tab="nav-visibility">
            <svg class="side-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="18" r="2" fill="currentColor"/></svg>

        </div>
      </div>
    </nav>
    <div class="side-foot">

  <div class="admin1-frame">
    <header class="main-top admin1-topnav">

        <nav class="admin1-crumbs" aria-label="目前位置">

          <span class="admin1-crumb-sep" aria-hidden="true">/</span>
          <h1 id="pageTitle">更新說明</h1>
        </nav>
      </div>
      <div class="admin1-top-trailing">
        <span class="meta" id="topMeta" data-admin1-meta-static="1">草稿 / 推送</span>
        <button type="button" class="admin1-icon-btn" id="admin1ThemeToggle" title="切換主題" aria-label="切換淺色／深色">
          <svg data-admin1-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg data-admin1-theme-icon="moon" hidden viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
        </button>
      </div>
    </header>
    <main class="main rn-editor-main">
      <section data-rn-tab-panel="release-notes">
        <div id="admin-release-notes-root"></div>
      </section>
      <section data-rn-tab-panel="release-history" hidden>
        <div id="admin-release-notes-history-root"></div>
      </section>
      <section data-rn-tab-panel="nav-visibility" hidden>
        <div id="admin-nav-visibility-root"></div>
      </section>
    </main>
  </div>
</div>
