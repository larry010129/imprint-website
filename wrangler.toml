# Cloudflare Worker stub only — full imprint site deploys on Render.
# Cloudflare Git integration: npx wrangler deploy
#
# compat date ≤ 2025-08-13 keeps legacy `on_fetch` (no workers-py SDK).
# After 2025-08-14 you must use WorkerEntrypoint + pywrangler.

name = "imprint-website"
main = "src/entry.py"
compatibility_date = "2025-08-13"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]
