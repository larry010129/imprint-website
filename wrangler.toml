# Cloudflare Python Workers config.
# Production site still deploys on Render — see scripts/render-start.sh / README.
#
# Commands (use pywrangler for Python Workers, not plain `wrangler deploy`):
#   uvx --from workers-py pywrangler dev
#   uvx --from workers-py pywrangler deploy
#
# Requires: Node + uv (https://docs.astral.sh/uv/)

name = "imprint-website"
main = "src/entry.py"
# Must not be ahead of Cloudflare UTC "today" (TW midnight can still be prior UTC day).
compatibility_date = "2026-07-30"
compatibility_flags = ["python_workers"]
