# Single Render web service (featured video refreshes lazily on home/about load).
# Dashboard → Blueprints → Sync after push
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: imprint-api
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NO_OPEN
        value: "1"
      # Optional: Bearer for POST /api/featured-video-sync (not required; home load auto-refreshes).
      - key: FEATURED_VIDEO_SYNC_SECRET
        sync: false
