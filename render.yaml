# Single Render web service (featured video refreshes lazily on home/about load).
# Dashboard → Blueprints → Sync after push
# https://render.com/docs/blueprint-spec
#
# CMS content lives in the cloud DB + Supabase Storage. For edits made on any
# device to appear everywhere, DATABASE_URL here must point at the SAME
# database (host + db name) as your local .env — if local uses the Neon
# database, paste the identical Neon URI here (or switch BOTH to Supabase).
# sync: false = set the value in the Render dashboard; never commit secrets.
services:
  - type: web
    name: imprint-api
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NO_OPEN
        value: "1"
      # Skip live Allbeauty scrape on boot. Interval loop + /api/gold-refresh
      # still update gold_price_cache; first request uses the existing row.
      - key: GOLD_SCRAPE_ON_STARTUP
        value: "0"
      # --- Persistence (required — must match local .env targets) ---
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: shop-media
      # --- Auth / integrations (required for full functionality) ---
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RECAPTCHA_SITE_KEY
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://www.imprint-diamond.com
      # Optional: Bearer for POST /api/featured-video-sync (admin UI sync button is the primary path).
      - key: FEATURED_VIDEO_SYNC_SECRET
        sync: false
