# Single Render service: FastAPI + Jinja SSR (HTML + JSON + static)
# Dashboard → Blueprints → Sync after push
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: imprint-api
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: NO_OPEN
        value: "1"
